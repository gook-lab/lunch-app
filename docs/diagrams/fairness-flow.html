<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>점심 추첨 흐름 · Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f3f2f2;
      --color-ink:     #201e1d;
      --color-muted:   #444141;
      --color-soft:    #605d5d;
      --color-accent:  #ec3013;
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-soft);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Fairness</p>
    <h1>점심 추첨 흐름 — 당첨은 한 곳에서 결정</h1>

    <svg viewBox="0 0 960 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lunch-fairness-flow-title lunch-fairness-flow-desc">
      <title id="lunch-fairness-flow-title">점심 추첨 흐름</title>
      <desc id="lunch-fairness-flow-desc">게임을 고르면 후보에서 당첨을 한 번 뽑고, 게임은 그 번호에 맞춰 연출만 하며, 확정하면 방문을 기록해 최근 7일 동안 후보에서 뺀다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444141"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ec3013"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f3f2f2"/>

      <!-- Connectors first, so nodes paint over any stroke end -->
      <g fill="none" stroke="#444141" stroke-width="1" marker-end="url(#arrow)">
        <path d="M280 168 H360"/>
        <path d="M600 168 H680"/>
        <path d="M800 216 V296"/>
        <path d="M680 344 H600"/>
        <path d="M360 344 H280"/>
        <path d="M160 392 V472"/>
      </g>
      <!-- Transit loop: the result goes back to candidate selection on the next run -->
      <path d="M40 520 H24 A8 8 0 0 0 16 512 V96 A8 8 0 0 0 24 88 H472 A8 8 0 0 0 480 96 V120"
            fill="none" stroke="#444141" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Connector labels, each masked with an 8px gap above or beside its stroke -->
      <rect x="168" y="64" width="176" height="16" rx="2" fill="#f3f2f2"/>
      <text x="256" y="76" fill="#444141" font-size="12" font-family="'Noto Sans KR', sans-serif" font-weight="500" text-anchor="middle">다음 후보 계산에 반영</text>

      <rect x="808" y="244" width="72" height="18" rx="2" fill="#f3f2f2"/>
      <text x="844" y="257" fill="#444141" font-size="12" font-family="'Noto Sans KR', sans-serif" font-weight="500" text-anchor="middle">결과 번호</text>

      <rect x="608" y="320" width="64" height="16" rx="2" fill="#f3f2f2"/>
      <text x="640" y="332" fill="#444141" font-size="12" font-family="'Noto Sans KR', sans-serif" font-weight="500" text-anchor="middle">연출 끝</text>

      <rect x="284" y="320" width="72" height="16" rx="2" fill="#f3f2f2"/>
      <text x="320" y="332" fill="#444141" font-size="12" font-family="'Noto Sans KR', sans-serif" font-weight="500" text-anchor="middle">확정 저장</text>

      <rect x="168" y="412" width="72" height="16" rx="2" fill="#f3f2f2"/>
      <text x="204" y="424" fill="#444141" font-size="12" font-family="'Noto Sans KR', sans-serif" font-weight="500" text-anchor="middle">방문 기록</text>

      <!-- Node 1: 게임 선택 -->
      <rect x="40" y="120" width="240" height="96" rx="6" fill="#f3f2f2"/>
      <rect x="40" y="120" width="240" height="96" rx="6" fill="#ffffff" stroke="#201e1d" stroke-width="1"/>
      <text x="160" y="160" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">게임 선택</text>
      <text x="160" y="182" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">App.tsx · mode</text>
      <text x="160" y="200" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">GameMode</text>

      <!-- Node 2: 후보 산출 -->
      <rect x="360" y="120" width="240" height="96" rx="6" fill="#f3f2f2"/>
      <rect x="360" y="120" width="240" height="96" rx="6" fill="#ffffff" stroke="#201e1d" stroke-width="1"/>
      <text x="480" y="160" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">후보 산출</text>
      <text x="480" y="182" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">selectCandidates()</text>
      <text x="480" y="200" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">lib/candidates.ts</text>

      <!-- Node 3: 당첨 결정 (focal, the only fairness decision) -->
      <rect x="680" y="120" width="240" height="96" rx="6" fill="#f3f2f2"/>
      <rect x="680" y="120" width="240" height="96" rx="6" fill="rgba(236,48,19,0.08)" stroke="#ec3013" stroke-width="1.2"/>
      <text x="800" y="160" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">당첨 결정</text>
      <text x="800" y="182" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">pickWinner(Math.random)</text>
      <text x="800" y="200" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">App.tsx spin()</text>

      <!-- Node 4: 게임 연출 -->
      <rect x="680" y="296" width="240" height="96" rx="6" fill="#f3f2f2"/>
      <rect x="680" y="296" width="240" height="96" rx="6" fill="#ffffff" stroke="#201e1d" stroke-width="1"/>
      <text x="800" y="336" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">게임 연출</text>
      <text x="800" y="358" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">winnerIndex</text>
      <text x="800" y="376" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">components/games/</text>

      <!-- Node 5: 확정 저장 -->
      <rect x="360" y="296" width="240" height="96" rx="6" fill="#f3f2f2"/>
      <rect x="360" y="296" width="240" height="96" rx="6" fill="#ffffff" stroke="#201e1d" stroke-width="1"/>
      <text x="480" y="336" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">확정</text>
      <text x="480" y="358" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">commit(place)</text>
      <text x="480" y="376" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">App.tsx</text>

      <!-- Node 6: 기록 (store treatment) -->
      <rect x="40" y="296" width="240" height="96" rx="6" fill="#f3f2f2"/>
      <rect x="40" y="296" width="240" height="96" rx="6" fill="rgba(32,30,29,0.05)" stroke="#444141" stroke-width="1"/>
      <text x="160" y="336" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">기록</text>
      <text x="160" y="358" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">visits/{day}</text>
      <text x="160" y="376" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">services/lunch.firebase.ts</text>

      <!-- Node 7: 최근 방문 제외 -->
      <rect x="40" y="472" width="240" height="96" rx="6" fill="#f3f2f2"/>
      <rect x="40" y="472" width="240" height="96" rx="6" fill="#ffffff" stroke="#201e1d" stroke-width="1"/>
      <text x="160" y="512" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">최근 방문 제외</text>
      <text x="160" y="534" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">RECENT_WINDOW_DAYS = 7</text>
      <text x="160" y="552" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">recentlyVisitedIds</text>

      <!-- Legend strip -->
      <line x1="40" y1="600" x2="920" y2="600" stroke="rgba(32,30,29,0.12)" stroke-width="0.8"/>
      <rect x="40" y="620" width="16" height="16" rx="2" fill="rgba(236,48,19,0.08)" stroke="#ec3013" stroke-width="1.2"/>
      <text x="64" y="633" fill="#444141" font-size="12" font-family="'Noto Sans KR', sans-serif" font-weight="500">당첨을 정하는 곳 (한 곳)</text>
      <line x1="320" y1="628" x2="352" y2="628" stroke="#444141" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="364" y="633" fill="#444141" font-size="12" font-family="'Noto Sans KR', sans-serif" font-weight="500">다음 판 후보 계산으로 돌아감</text>
      <line x1="640" y1="628" x2="672" y2="628" stroke="#444141" stroke-width="1"/>
      <text x="684" y="633" fill="#444141" font-size="12" font-family="'Noto Sans KR', sans-serif" font-weight="500">흐름</text>
    </svg>
  </div>
</body>
</html>
